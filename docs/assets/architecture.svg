  <text x="633" y="172" text-anchor="middle" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">optional servers</text>

  <rect x="548" y="200" width="170" height="64" rx="10" fill="#334155" stroke="#64748b"/>
  <text x="633" y="228" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Sandbox</text>
  <text x="633" y="248" text-anchor="middle" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">local � docker</text>

  <rect x="268" y="278" width="200" height="88" rx="10" fill="#0f766e" stroke="#5eead4"/>
