<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">OpenAgents architecture</title>
  <desc id="desc">Web client talks to the API; the API loads Agents and connects to sandbox, MCP, and models.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="920" height="420" rx="16" fill="url(#bg)"/>
  <text x="40" y="48" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">OpenAgents</text>
  <text x="40" y="74" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Self-hostable agent workspace specialized by Agents</text>

  <rect x="40" y="120" width="160" height="72" rx="10" fill="#334155" stroke="#64748b"/>
  <text x="120" y="152" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Web</text>
  <text x="120" y="172" text-anchor="middle" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Next.js � AG-UI</text>

  <line x1="200" y1="156" x2="260" y2="156" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

