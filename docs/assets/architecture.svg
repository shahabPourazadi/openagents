  <text x="368" y="142" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">API</text>
  <text x="368" y="164" text-anchor="middle" fill="#dbeafe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">FastAPI � Pydantic AI</text>
  <text x="368" y="182" text-anchor="middle" fill="#bfdbfe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">deep agent + tools</text>

  <line x1="468" y1="130" x2="540" y2="90" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="468" y1="156" x2="540" y2="156" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="468" y1="182" x2="540" y2="230" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="368" y1="208" x2="368" y2="270" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="548" y="48" width="170" height="64" rx="10" fill="#334155" stroke="#64748b"/>
  <text x="633" y="76" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Models</text>
  <text x="633" y="96" text-anchor="middle" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">OpenRouter-first</text>

