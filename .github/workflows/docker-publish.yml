# Build api + web images and push to GHCR (openagents-api / openagents-web).
# VPS or Compose hosts can pull these tags instead of building on the server.
name: Docker publish

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            image_name: openagents-api
          - name: web
            dockerfile: apps/web/Dockerfile
            image_name: openagents-web

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve image metadata and build args
        id: meta
        env:
          # Anon key is public-by-design; Variable is fine (Secret also works).
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          # GHCR requires lowercase repository paths.
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="${{ env.REGISTRY }}/${OWNER_LC}/${{ matrix.image_name }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          TAGS="${IMAGE}:sha-${SHORT_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${IMAGE}:main,${IMAGE}:latest"
          fi
          echo "owner=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Tagged: ${TAGS}"

          echo "api_url=${NEXT_PUBLIC_API_URL:-https://api.example.com}" >> "$GITHUB_OUTPUT"
          echo "supabase_url=${NEXT_PUBLIC_SUPABASE_URL:-https://base.example.com}" >> "$GITHUB_OUTPUT"
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::warning::NEXT_PUBLIC_SUPABASE_ANON_KEY not set; baking a placeholder. Set an Actions Variable/Secret for real deploys (NEXT_PUBLIC_* is compile-time)."
            echo "supabase_anon_key=placeholder-anon-key" >> "$GITHUB_OUTPUT"
          else
            echo "supabase_anon_key=${NEXT_PUBLIC_SUPABASE_ANON_KEY}" >> "$GITHUB_OUTPUT"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY is set (len=${#NEXT_PUBLIC_SUPABASE_ANON_KEY})"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.meta.outputs.api_url }}
            NEXT_PUBLIC_SUPABASE_URL=${{ steps.meta.outputs.supabase_url }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ steps.meta.outputs.supabase_anon_key }}
